<!DOCTYPE html>
<html lang="kaa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Sawda jurnalı, statistika, risk kalkulyatorı hám tekseriw dizimi">
<meta property="og:title" content="Sawda jurnalı hám statistika">
<meta property="og:description" content="Sawdalarıńızdı jazıń, statistikanı hám riskti avtomat kóriń.">
<meta name="theme-color" content="#c9a227">
<title>Sawda jurnalı hám statistika</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef2f9;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--g:#16a34a;--r:#dc2626;--o:#c9a227;--gbg:#f0fdf4;--rbg:#fef2f2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#131c2e;--ink:#e5e9f2;--mut:#94a3b8;--line:#243049;--gbg:#10261a;--rbg:#2a1416}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
.wrap{max-width:1200px;margin:0 auto}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.logo{width:64px;height:64px;border-radius:50%;box-shadow:0 2px 10px rgba(0,0,0,.25)}
h1{font-size:21px;margin:0 0 3px}.sub{color:var(--mut);font-size:13px}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:14px 0 0;padding-bottom:4px}
button{padding:9px 13px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
button.on{background:var(--o);border-color:var(--o);color:#fff}
.card{background:var(--card);border-radius:16px;padding:16px;margin-top:14px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi small{display:block;color:var(--mut);font-size:11px;text-transform:uppercase;font-weight:600}
.kpi b{font-size:21px}
label{font-size:12px;color:var(--mut);font-weight:600;display:block;margin-bottom:4px}
input,select,textarea{width:100%;padding:8px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:14px;min-width:0;font-family:inherit}
.mgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
.mh{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px;font-size:14px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal i{font-style:normal;border:1px solid var(--line);border-radius:7px;min-height:50px;padding:3px;font-size:10px;display:flex;flex-direction:column}
.cal i.wh{border:0;min-height:0;text-align:center;color:var(--mut);font-weight:700}
.cal i.w{background:var(--gbg);border-color:var(--g)}.cal i.l{background:var(--rbg);border-color:var(--r)}
.cal b{font-size:11px}.cal span{font-weight:700}.cal small{color:var(--mut)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:1100px;font-size:13px}
th{text-align:left;color:var(--mut);font-size:11px;text-transform:uppercase;padding:6px}
td{padding:4px}td input,td select{padding:6px}
.g{color:var(--g)}.r{color:var(--r)}.m{color:var(--mut)}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--g)}
.ck{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.ck input{width:20px;margin-top:2px}
.two{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
</style>
</head>

function cyr(s){
  return s.replace(/[A-Za-zÁáǴǵŃńÓóÚúı]+/g,w=>{
    if(/^[A-Z]{2,}$/.test(w)||w==="PnL")return w;
    const l=w.toLowerCase();let o="";
    for(let i=0;i<l.length;i++){
      const t2=l.substr(i,2);let c,n=1;
      if(t2==="sh")[c,n]=["ш",2];else if(t2==="ch")[c,n]=["ч",2];else if(t2==="ya")[c,n]=["я",2];
      else if(t2==="yu")[c,n]=["ю",2];else if(t2==="yo")[c,n]=["ё",2];else if(t2==="ye")[c,n]=["е",2];
      else if(t2==="ts")[c,n]=["ц",2];else c=M[l[i]]||l[i];
      o+=(w[i]!==l[i])?c.toUpperCase():c;i+=n-1;
    }
    return o;
  });
}

function viewRk(){
  const c=S.rc,fld=(k,l)=>`<div><label>${T(l)}</label><input data-rc="${k}" type="number" step="any" value="${c[k]}"></div>`;
  $("main").innerHTML=`<div class="two"><div class="card"><div class="grid">${fld("risk","Ulıwma risk ($)")}${fld("n","Ulıwma sawda sanı")}${fld("rr","TP RR")}${fld("mul","Risk kóbeytkish")}${fld("from","Neshinshi sawdadan baslanadı")}</div><div id="rko" class="tw" style="margin-top:12px"></div></div>
  <div><div class="card" style="margin-top:14px"><div class="grid">${fld("r1","Bir sawdaǵa risk ($)")}${fld("sl","SL (pt)")}${fld("pt","1 pt bahası ($)")}</div><div class="grid" id="lotk" style="margin-top:12px"></div><p class="m" style="font-size:12px">${T("Lot = risk / SL / 1 pt bahası. 1 pt bahası: XAUUSD 1, EURUSD 10, SP500 0.1, BTCUSD 0.01")}</p></div>
  <div class="card"><b>${T("Risk limitleri")}</b><div class="tw" id="limo" style="margin-top:8px"></div></div></div></div>`;
  upRk();
}
function upRk(){
  const c=S.rc,N=Math.max(1,Math.floor(c.n)),ok=!(c.from<=0||c.from>N||c.mul<=0);
  const w=i=>ok?(i<c.from?1:Math.pow(c.mul,i-c.from+1)):1;
  const den=(!ok||c.mul===1)?N:(c.from-1)+c.mul*(Math.pow(c.mul,N-c.from+1)-1)/(c.mul-1);
  let cum=0,rows="";
  for(let i=1;i<=N;i++){
    const r=c.risk*w(i)/den,p=r*c.rr;
    rows+=`<tr><td>${i}</td><td>$${r2(r)}</td><td class="g">+$${r2(p)}</td><td class="r">${i>1?"−$"+r2(cum):"—"}</td><td class="${cls(p-cum)}">${i>1?money(p-cum):"—"}</td></tr>`;
    cum+=r;
  }
  rows+=`<tr><td colspan="3" class="m">${T("Hámme sawda zıyan bolsa")}</td><td class="r">−$${r2(cum)}</td><td></td></tr>`;
  $("rko").innerHTML=`<table style="min-width:0"><thead><tr><th>${T("Sawda")}</th><th>${T("Risk")}</th><th>${T("Payda")}</th><th>${T("Zıyan")}</th><th>${T("Delta payda")}</th></tr></thead><tbody>${rows}</tbody></table>`;
  $("lotk").innerHTML=kpi([["Lot",c.sl&&c.pt?r2(c.r1/c.sl/c.pt*100)/100:"—"]]);
  $("limo").innerHTML=`<table style="min-width:0"><thead><tr><th>${T("Dáwir")}</th><th>${T("Risk")} %</th><th>${T("Risk")} $</th><th>${T("Payda")} %</th><th>${T("Payda")} $</th></tr></thead><tbody>${c.lim.map((l,i)=>`<tr><td>${T(LIM[i])}</td><td><input data-lim="${i},0" type="number" step="any" value="${l[0]}"></td><td class="r">${money(S.dep*l[0]/100)}</td><td><input data-lim="${i},1" type="number" step="any" value="${l[1]}"></td><td class="g">${money(S.dep*l[1]/100)}</td></tr>`).join("")}</tbody></table>`;
}
